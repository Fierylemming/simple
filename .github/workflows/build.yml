name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: |
          set +e
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
          EC=${PIPESTATUS[0]}
          grep -n "error:" /tmp/build.log | head -n 100 > /tmp/errors.txt || true
          grep "FAILURE" /tmp/build.log | head -n 20 >> /tmp/errors.txt || true
          tail -n 400 /tmp/build.log > /tmp/tail.log
          cat /tmp/tail.log
          cat /tmp/errors.txt
          echo "EXITCODE:$EC"
          exit $EC
      - name: Publish logs to branch on failure
        if: failure()
        run: |
          cp /tmp/build.log ./build.log 2>/dev/null || echo "no log" > build.log
          cp /tmp/errors.txt ./errors.txt 2>/dev/null || true
          cp /tmp/tail.log ./tail.log 2>/dev/null || true
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git checkout -B build-log-temp
          git add -f build.log errors.txt tail.log
          git commit -m "log $GITHUB_SHA" || true
          git push -f origin build-log-temp
      - name: Publish jar on success
        if: success()
        run: |
          JAR=$(ls build/libs/*.jar | head -n1)
          echo "Jar $JAR"
          ls -lh build/libs/
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git checkout -B dist-jar
          cp "$JAR" ./simplecolonies-prism.jar
          ls -lh *.jar
          git add -f simplecolonies-prism.jar
          git commit -m "jar $GITHUB_SHA" || true
          git push -f origin dist-jar

name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew build --stacktrace
      - name: List jar
        if: always()
        run: ls -lh build/ 2>&1 | head -n 50; ls -lh build/libs/ 2>&1 | head -n 50
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simplecolonies-prism-jar
          path: build/libs/*.jar
      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-${{ github.sha }}
          name: Prism ${{ github.sha }}
          body: "Prism jar for ${{ github.sha }} — drop into mods/"
          files: build/libs/*.jar
          prerelease: true

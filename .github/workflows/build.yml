name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: |
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
          EC=${PIPESTATUS[0]}
          if [ $EC -ne 0 ]; then
            echo "::error::Build failed — tail:"
            tail -n 100 /tmp/build.log | while read line; do echo "::error::$line"; done
          fi
          exit $EC

name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: |
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
          echo "===== TAIL ====="
          tail -n 200 /tmp/build.log
          echo "===== ERRORS ====="
          grep -n "error" /tmp/build.log | head -n 100

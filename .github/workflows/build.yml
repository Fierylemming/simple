name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew build
      - name: Publish to Prism branch
        if: success()
        run: |
          JAR=$(ls build/libs/*.jar | head -n1)
          echo "Built $JAR"
          ls -lh build/libs/
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git checkout -B dist-jar
          cp "$JAR" ./simplecolonies-prism.jar
          git add -f simplecolonies-prism.jar
          git commit -m "jar $GITHUB_SHA" || true
          git push -f origin dist-jar

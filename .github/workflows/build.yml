name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Build jar
        run: ./gradlew build --no-configuration-cache --rerun-tasks --stacktrace
      - name: Upload Prism jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simplecolonies-prism-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-${{ github.sha }}
          name: Prism build ${{ github.sha }}
          body: "Drop in Prism mods folder. NeoForge 1.21.1 + optional Create."
          files: build/libs/*.jar
          prerelease: true

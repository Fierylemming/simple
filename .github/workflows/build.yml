name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew build --stacktrace
      - name: Create Prism release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-${{ github.sha }}
          name: SimpleColonies Prism build ${{ github.sha }}
          body: |
            Prism-ready jar for branch arena/957b7435-simple
            Commit: ${{ github.sha }}
            Download simplecolonies-prism.jar below and drop in Prism mods folder.
            Requires: NeoForge 1.21.1 (21.1.265), Java 21. Optional: Create 6.x + Create Aeronautics.
          files: build/libs/*.jar
          prerelease: true
          generate_release_notes: false

name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
      - name: Push log to branch on failure
        if: failure()
        run: |
          cp /tmp/build.log ./build.log
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add build.log
          git commit -m "build log ${{ github.sha }}" || true
          git push origin HEAD:build-log --force

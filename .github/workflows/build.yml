name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew build --stacktrace
      - name: Publish jar to branch for Prism
        if: success()
        run: |
          JAR=$(ls build/libs/*.jar | head -n1)
          echo "Built $JAR $(du -h $JAR)"
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          # create orphan branch with just the jar
          git checkout --orphan dist-jar
          git reset --hard
          cp "$GITHUB_WORKSPACE/$JAR" ./simplecolonies-${GITHUB_SHA::7}.jar 2>/dev/null || cp build/libs/*.jar ./simplecolonies.jar
          ls -lh *.jar
          git add -f *.jar
          git commit -m "jar $GITHUB_SHA" || true
          git push -f origin dist-jar 2>&1 | head -n 20

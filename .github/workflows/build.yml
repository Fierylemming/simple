name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew build --info 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Run construction GameTests
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          timeout 300s ./gradlew runGameTestServer --info 2>&1 | tee gametest.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Report failure details
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          log = Path('gametest.log') if Path('gametest.log').exists() else Path('build.log')
          lines = log.read_text(errors='replace').splitlines()
          highlights = [line for line in lines if any(term in line.lower() for term in ('error', 'failed', 'exception', 'gametest', 'builder ', 'tests failed'))]
          text = '\n'.join(highlights[-16:] + lines[-16:])[-3500:].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
          print('::error title=Build log tail::' + text)
          PYCODE
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            gametest.log
          if-no-files-found: warn
      - name: Upload Prism jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simplecolonies-prism-jar
          path: build/libs/*.jar
      - name: Get version
        if: success()
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r\n ')" >> $GITHUB_OUTPUT
      - name: Create Release
        if: success() && !contains(github.event.head_commit.message, '[no release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          body: "SimpleColonies ${{ steps.version.outputs.version }} — Drop into Prism mods/. NeoForge 1.21.1 + Java 21 — commit ${{ github.sha }}"
          files: build/libs/*.jar
          prerelease: true

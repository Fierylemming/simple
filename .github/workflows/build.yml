name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: |
          ./gradlew build --stacktrace
          ls -lh build/libs/ || echo "no libs"
          ls -lh build/ || true
      - name: Upload Prism jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplecolonies-prism-jar
          path: build/libs/
          if-no-files-found: warn
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-${{ github.sha }}
          name: Prism ${{ github.sha }}
          body: "Prism jar for ${{ github.sha }}"
          files: build/libs/*.jar
          prerelease: true

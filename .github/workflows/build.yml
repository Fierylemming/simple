name: Build
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew build
      - name: List build output
        if: always()
        run: ls -lh build/libs/ || echo "no jar"
      - name: Upload Prism jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simplecolonies-prism-jar
          path: build/libs/*.jar
      - name: Create Prism Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-${{ github.sha }}
          name: SimpleColonies Prism ${{ github.sha }}
          body: |
            Prism-ready jar — drop into `mods/` folder.
            Requires: NeoForge 1.21.1 (21.1.265), Java 21.
            Optional: Create 6.x + Create Aeronautics 1.3.2 — mod works without them.
            Test: `/colony spawn greek`, `/colony warehouse`, `/colony research`, `/colony buy TOOL_STONE`
          files: build/libs/*.jar
          prerelease: true

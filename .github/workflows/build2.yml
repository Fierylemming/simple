name: Build2
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew build --stacktrace --info > build.log 2>&1 || true; cat build.log | tail -n 800
      - run: ls build/libs/ 2>&1 | head -n 20; cat build.log | grep -i "error" | head -n 50

name: Release Prism jar
on:
  push:
    branches: ['arena/957b7435-simple']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        default: '45ca154af4d4a6f3fbb0ebf0805926eef5de8a4a'
        required: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '45ca154af4d4a6f3fbb0ebf0805926eef5de8a4a' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: simplecolonies-prism-jar
          path: build/libs/*.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-${{ github.sha }}
          name: Prism ${{ github.sha }}
          body: "Prism jar — drop into mods/. NeoForge 1.21.1 + Java 21."
          files: build/libs/*.jar
          prerelease: true

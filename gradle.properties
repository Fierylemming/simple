# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment - better parameter names & javadoc
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties - NeoForge 1.21.1 is required for Create Aeronautics compatibility
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.265
loader_version_range=[1,)

## Mod Properties - Simple Colonies
mod_id=simplecolonies
mod_name=Simple Colonies
mod_license=MIT
mod_version=0.1.1
mod_group_id=com.simplecolonies
mod_authors=FieryLemming
mod_display_url=https://github.com/Fierylemming/simple
mod_description=Ancient Villages - A simpler MineColonies-inspired mod with self-sufficient AI villages in Egyptian, Roman, Greek, Persian and Mesopotamian styles. Villagers need food, housing, and supply chains to survive and expand.
